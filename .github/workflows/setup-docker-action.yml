---
# GitHub Actions workflow for validating Docker setup
# Manually triggered to verify the docker/setup-docker-action with the
# containerd snapshotter feature enabled
name: setup-docker-action

on:
  workflow_dispatch:

permissions: read-all

jobs:
  setup-docker-action:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Docker
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
