---
# GitHub Actions workflow for validating Docker setup
# Manually triggered to verify the docker/setup-docker-action with the
# containerd snapshotter feature enabled
name: setup-docker-action

on:
  workflow_dispatch:

permissions: read-all

jobs:
  setup-docker-action:
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 5
    steps:
      - name: Set up Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
